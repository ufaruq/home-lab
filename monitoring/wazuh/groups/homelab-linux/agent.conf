<agent_config os="Linux">
  <syscheck>
    <disabled>no</disabled><frequency>43200</frequency>
    <directories check_all="yes">/etc</directories>
    <ignore>/etc/mtab</ignore>
  </syscheck>
  <wodle name="syscollector">
    <disabled>no</disabled><interval>12h</interval><scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware><os>yes</os><network>yes</network><packages>yes</packages>
    <ports all="no">yes</ports><processes>no</processes>
  </wodle>
  <localfile><location>/var/log/auth.log</location><log_format>syslog</log_format></localfile>
  <localfile><location>/var/log/audit/audit.log</location><log_format>audit</log_format></localfile>
</agent_config>
