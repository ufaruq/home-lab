<agent_config os="Windows">
  <syscheck>
    <disabled>no</disabled><frequency>43200</frequency>
    <directories check_all="yes">C:\Windows\System32\drivers\etc</directories>
  </syscheck>
  <wodle name="syscollector">
    <disabled>no</disabled><interval>12h</interval><scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware><os>yes</os><network>yes</network><packages>yes</packages>
    <ports all="no">yes</ports><processes>no</processes>
  </wodle>
  <localfile>
    <location>Security</location><log_format>eventchannel</log_format>
    <query>Event/System[EventID=4625 or EventID=4720 or EventID=4726 or EventID=1102]</query>
  </localfile>
</agent_config>
