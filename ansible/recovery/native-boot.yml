---
- name: Restore reviewed native guest boot and graceful shutdown wiring
  hosts: xcp_control
  gather_facts: false
  vars:
    native_recovery_apply: false
    recovery_helper_encoded: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/native_boot.py') | b64encode }}"
    recovery_helper_runner: "import base64; exec(compile(base64.b64decode('{{ recovery_helper_encoded }}'), '<home-lab-native-boot>', 'exec'))"
    storage_helper_encoded: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../scripts/xen/upgrade_restore.py') | b64encode }}"
  tasks:
    - name: Require an explicit boolean apply selection
      ansible.builtin.assert:
        that:
          - native_recovery_apply is boolean
          - native_recovery_policy is defined
          - native_recovery_policy is mapping
    - name: Restore declared permanent raw disk aliases before native startup wiring
      ansible.builtin.raw: >-
        /usr/bin/python -c {{ storage_runner | quote }}
      vars:
        storage_runner: |
          import base64,json,os
          inventory={}
          for line in open('/etc/xensource-inventory'):
              if '=' in line:
                  k,v=line.strip().split('=',1);inventory[k]=v.strip("'\"")
          expected=json.loads(base64.b64decode('{{ native_recovery_policy.expected_host_uuid | to_json | b64encode }}'))
          if inventory.get('INSTALLATION_UUID')!=expected or os.geteuid()!=0:raise ValueError('Storage recovery host identity or privilege mismatch')
          library={'__name__':'storage_recovery_library'}
          exec(compile(base64.b64decode('{{ storage_helper_encoded }}'),'<storage-recovery>','exec'),library)
          links=json.loads(base64.b64decode('{{ host_storage_links | default({}) | to_json | b64encode }}'))
          changes=library['restore_links']('/',links,{{ 'True' if native_recovery_apply and not ansible_check_mode else 'False' }})
          print(json.dumps({'changed':bool(changes),'storage_aliases':changes}))
      register: storage_recovery_result
      check_mode: false
      changed_when: (storage_recovery_result.stdout_lines | select('match', '^[{]') | list | last | from_json).changed
    - name: Run native Python helper without installing host packages or a custom agent
      ansible.builtin.raw: "/usr/bin/python -c {{ recovery_helper_runner | quote }} --policy-base64 {{ (native_recovery_policy | to_json | b64encode) | quote }} {{ '--apply' if native_recovery_apply and not ansible_check_mode else '--check' }}"
      register: native_recovery_result
      check_mode: false
      changed_when: native_recovery_result.rc == 0 and ((native_recovery_result.stdout_lines | select('match', '^[{]') | list | last | default('{}') | from_json).changed | default(false))
    - name: Report native boot wiring and private original-state backup metadata
      ansible.builtin.debug:
        msg: "{{ native_recovery_result.stdout_lines | select('match', '^[{]') | list | last | from_json }}"
