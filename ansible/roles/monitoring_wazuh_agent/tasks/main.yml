---
- name: Require explicit access, deployment and compatible version declarations
  ansible.builtin.assert:
    that:
      - monitoring_access_verified is sameas true
      - monitoring_deployment_approved is sameas true
      - monitoring_wazuh_agent_version is match('^4\.[0-9]+\.[0-9]+$')
      - monitoring_wazuh_manager_version is match('^4\.[0-9]+\.[0-9]+$')
      - monitoring_wazuh_agent_version.split('.')[0:2] == monitoring_wazuh_manager_version.split('.')[0:2]
      - monitoring_wazuh_agent_version is version(monitoring_wazuh_manager_version, '<=')
      - monitoring_wazuh_manager_address is match('^[A-Za-z0-9][A-Za-z0-9.:-]*$')
      - monitoring_wazuh_manager_port | int > 0
      - monitoring_wazuh_manager_port | int < 65536
      - monitoring_wazuh_agent_group in ['homelab-linux', 'homelab-windows', 'homelab-lab']
      - ansible_facts.os_family in ['Debian', 'RedHat', 'Windows']

- name: Manage Linux agent without reinstalling adopted packages
  ansible.builtin.include_tasks: linux.yml
  when: ansible_facts.os_family != 'Windows'

- name: Manage Windows agent without replacing its identity
  ansible.builtin.include_tasks: windows.yml
  when: ansible_facts.os_family == 'Windows'
